rting details.</p><a class="button" href="${x.link}" target="_blank" rel="noopener noreferrer">Read original at ${esc(x.source)} →</a></div><p class="note">BlockBrief does not republish the full article and does not replace the original publisher.</p>`}catch(e){el.innerHTML='<div class="error"><strong>This story is no longer in the current live feed.</strong><br><br><a class="back" href="/">← Return to BlockBrief</a></div>'}}load()</script></body></html>
