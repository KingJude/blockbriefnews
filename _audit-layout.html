<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><title>Layout verification</title><style>body{margin:12px;font:16px Arial;background:#eee}iframe{display:block;border:0;height:780px;margin-top:12px;background:#020711}button,select{padding:12px}</style></head><body><label>Viewport <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option></select></label> <label>Page <select id="page"><option value="/">Home</option><option value="/#latest">Latest headlines</option><option value="/#world-clock">World clock section</option><option value="/bitcoin/">Bitcoin</option><option value="/regulation/">Regulation</option><option value="/world-clock-widget.html">World clock embed</option><option value="/story/?u=https%3A%2F%2Fwww.cnbc.com%2Fexample-expired-story">Expired story</option></select></label><pre id="metrics"></pre><iframe title="Responsive page" src="/" width="390"></iframe><script>document.getElementById("width").onchange=e=>document.querySelector("iframe").width=e.target.value;document.getElementById("page").onchange=e=>document.querySelector("iframe").src=e.target.value;setInterval(()=>{try{const f=document.querySelector('iframe'),w=f.contentWindow,d=f.contentDocument,h=d.querySelector('header'),s=d.querySelector('.site-header-spacer');document.getElementById('metrics').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,headerTop:h?.getBoundingClientRect().top,headerHeight:h?.offsetHeight,spacer:s?.offsetHeight,lang:d.documentElement.lang,cards:d.querySelectorAll('.card').length,prices:[...d.querySelectorAll('.price')].map(x=>x.textContent),brokenImages:[...d.images].filter(x=>x.complete&&!x.naturalWidth).length},null,2)}catch{}},1000);</script></body></html>
